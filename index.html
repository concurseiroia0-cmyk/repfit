    <meta
      name="description"
      content="RepFit — registre e acompanhe seus treinos, 100% offline e privado, direto no seu dispositivo."
    />
    <title>RepFit</title>
    <script>
      // Aplica o tema salvo antes do React carregar para evitar "flash" de tema errado.
      try {
        var t = localStorage.getItem('diario.tema');
        if (
          t === 'dark' ||
          (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <!-- Google AdSense: só carrega em domínios verificados (evita script em preview/localhost) -->
    <script>
      (function () {
        try {
          var host = window.location.hostname;
          var dominiosPermitidos = [
            'repfit.inosaas.com.br',
            'www.repfit.inosaas.com.br',
            'localhost'
          ];
          var permitido = dominiosPermitidos.some(function (d) {
            return host === d || host.endsWith('.' + d);
          });
          if (!permitido) return;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9155959825288070';
          s.crossOrigin = 'anonymous';
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
